<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brus Lai AS — hybrid glass chess mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050608;
    --bg-soft: #0a0c10;
    --cream: #f0eada;
    --cream-dim: #c4bea8;
    --muted: #6a6457;
    --line: rgba(240, 234, 218, 0.08);
    --green: #1d3832;
    --green-light: #2c4636;
    --teal: #4fd1c5;
    --teal-soft: #5eead4;
  }
  html, body {
    height: 100%;
    overflow-x: hidden;
  }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
  }
  /* Subtle film grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 200;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
    opacity: 0.05;
    mix-blend-mode: overlay;
  }

  /* ── NAV ── */
  nav.top {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 50;
    padding: 22px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(5, 6, 8, 0.6);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-bottom: 1px solid var(--line);
  }
  nav.top .brand {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    color: var(--cream);
  }
  nav.top ul {
    list-style: none;
    display: flex;
    gap: 38px;
  }
  nav.top ul a {
    color: var(--cream-dim);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 500;
    transition: color 0.2s;
    cursor: pointer;
  }
  nav.top ul a:hover { color: var(--cream); }

  /* ── HERO ── grid: text left, chess right */
  .hero {
    min-height: 100vh;
    padding: 120px 56px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
    max-width: 1500px;
    margin: 0 auto;
    position: relative;
  }

  /* ── TEXT SIDE ── */
  .text-side {
    z-index: 5;
    max-width: 600px;
  }
  .eyebrow {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 0.05em;
  }
  .eyebrow::before {
    content: '';
    width: 28px;
    height: 1px;
    background: var(--muted);
  }
  h1 {
    font-weight: 700;
    font-size: clamp(48px, 6.8vw, 96px);
    line-height: 1.0;
    letter-spacing: -0.035em;
    margin-bottom: 32px;
    color: var(--cream);
  }
  h1 .accent {
    background: linear-gradient(95deg, var(--teal-soft) 0%, var(--teal) 50%, #2dd4bf 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-style: italic;
    font-weight: 600;
  }
  .sub {
    font-size: 1.05rem;
    color: var(--cream-dim);
    line-height: 1.65;
    max-width: 480px;
    margin-bottom: 44px;
  }

  /* ── CTA PILL ── */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px 14px 28px;
    background: var(--green);
    border-radius: 100px;
    color: var(--cream);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: background 0.25s, transform 0.25s;
    border: 1px solid rgba(240, 234, 218, 0.05);
  }
  .cta:hover {
    background: var(--green-light);
    transform: translateY(-1px);
  }
  .cta .arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    background: var(--teal-soft);
    border-radius: 50%;
    color: var(--green);
    font-size: 1rem;
    font-weight: 700;
    transition: transform 0.25s;
  }
  .cta:hover .arrow { transform: translateX(3px); }

  /* ── CHESS SIDE ── */
  .chess-side {
    position: relative;
    height: 600px;
    z-index: 1;
  }
  #chess-canvas {
    position: absolute;
    inset: 0;
    cursor: grab;
  }
  #chess-canvas:active { cursor: grabbing; }

  /* Soft ambient light bloom behind chess */
  .chess-side::before {
    content: '';
    position: absolute;
    inset: -10%;
    background: radial-gradient(circle at 50% 50%, rgba(79, 209, 197, 0.12) 0%, transparent 60%);
    filter: blur(40px);
    pointer-events: none;
    z-index: 0;
  }

  /* ── DRAG HINT ── */
  .hint {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    padding: 8px 18px;
    background: rgba(240, 234, 218, 0.04);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 100px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 500;
    pointer-events: none;
    opacity: 0;
    animation: fadeIn 1.2s ease 1s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ── BOTTOM SCROLL HINT ── */
  .scroll-hint {
    position: fixed;
    bottom: 32px;
    right: 40px;
    z-index: 50;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    opacity: 0.6;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .hero {
      grid-template-columns: 1fr;
      padding: 100px 24px 40px;
    }
    .chess-side { height: 420px; }
    nav.top { padding: 16px 24px; }
    nav.top ul { gap: 22px; }
    nav.top ul a { font-size: 0.78rem; }
    h1 { font-size: clamp(36px, 9vw, 60px); }
    .scroll-hint { display: none; }
  }
</style>
</head>
<body>

<nav class="top">
  <a class="brand">Brus Lai AS</a>
  <ul>
    <li><a>Ventures</a></li>
    <li><a>Approach</a></li>
    <li><a>Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="text-side">
    <div class="eyebrow">Norwegian holding company</div>
    <h1>Patient capital<br>for the <span class="accent">long game</span>.</h1>
    <p class="sub">Strategic positions in technology and AI, paired with a small set of owned software and game ventures we operate ourselves.</p>
    <a class="cta">
      View portfolio
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="chess-side">
    <canvas id="chess-canvas"></canvas>
    <div class="hint">Drag to rotate</div>
  </div>
</section>

<div class="scroll-hint">Scroll</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('chess-canvas');
const container = canvas.parentElement;

const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(
  30,
  container.clientWidth / container.clientHeight,
  0.1, 100
);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// Procedural HDR environment for glass reflections
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
scene.environment = pmrem.fromScene(envScene, 0.04).texture;

// ── LIGHTS ──
const ambient = new THREE.HemisphereLight(0x88aaff, 0x111122, 0.3);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(6, 10, 8);
scene.add(key);

const accent1 = new THREE.PointLight(0x4fd1c5, 8, 18);
accent1.position.set(-4, 5, 4);
scene.add(accent1);

const accent2 = new THREE.PointLight(0x8ad8ff, 4, 12);
accent2.position.set(5, 3, -3);
scene.add(accent2);

const rim = new THREE.DirectionalLight(0xffd9a0, 0.4);
rim.position.set(-8, 2, -5);
scene.add(rim);

// ── GLASS BOARD ──
const glassBoardMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.92,
  ior: 1.5,
  thickness: 0.4,
  roughness: 0.06,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.02,
  attenuationColor: new THREE.Color(0x88c8c0),
  attenuationDistance: 1.5,
  side: THREE.DoubleSide,
  envMapIntensity: 1.4,
});

const BOARD_SIZE = 8;
const SQUARE = 0.7;
const TOTAL = BOARD_SIZE * SQUARE;

const boardGeo = new THREE.BoxGeometry(TOTAL, 0.18, TOTAL);
const board = new THREE.Mesh(boardGeo, glassBoardMat);
board.position.y = -0.09;
scene.add(board);

// Subtle engraved grid lines on top of board
const gridGeo = new THREE.BufferGeometry();
const gridPoints = [];
const half = TOTAL / 2;
for (let i = 0; i <= BOARD_SIZE; i++) {
  const p = -half + i * SQUARE;
  // horizontal
  gridPoints.push(-half, 0.001, p, half, 0.001, p);
  // vertical
  gridPoints.push(p, 0.001, -half, p, 0.001, half);
}
gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridPoints, 3));
const gridMat = new THREE.LineBasicMaterial({
  color: 0x4fd1c5,
  transparent: true,
  opacity: 0.18,
});
const grid = new THREE.LineSegments(gridGeo, gridMat);
scene.add(grid);

// ── GLASS PIECES (Lathe geometry with crystal material) ──
function silhouettePawn() {
  return [
    [0.00, 0.00], [0.30, 0.00], [0.30, 0.05],
    [0.22, 0.07], [0.18, 0.10], [0.18, 0.18],
    [0.22, 0.30], [0.20, 0.36], [0.15, 0.40],
    [0.14, 0.46], [0.20, 0.50], [0.22, 0.54],
    [0.18, 0.58], [0.00, 0.60]
  ];
}
function silhouetteRook() {
  return [
    [0.00, 0.00], [0.32, 0.00], [0.32, 0.07],
    [0.24, 0.10], [0.20, 0.13], [0.20, 0.48],
    [0.25, 0.50], [0.30, 0.52], [0.30, 0.62],
    [0.18, 0.62], [0.18, 0.66], [0.00, 0.66]
  ];
}
function silhouetteBishop() {
  return [
    [0.00, 0.00], [0.30, 0.00], [0.30, 0.06],
    [0.22, 0.09], [0.17, 0.13], [0.17, 0.42],
    [0.22, 0.55], [0.17, 0.62], [0.14, 0.66],
    [0.20, 0.72], [0.10, 0.85], [0.00, 0.92]
  ];
}
function silhouetteQueen() {
  return [
    [0.00, 0.00], [0.34, 0.00], [0.34, 0.07],
    [0.26, 0.11], [0.19, 0.15], [0.19, 0.58],
    [0.25, 0.70], [0.20, 0.76], [0.18, 0.80],
    [0.28, 0.86], [0.32, 0.92], [0.18, 1.02],
    [0.00, 1.08]
  ];
}
function silhouetteKing() {
  return [
    [0.00, 0.00], [0.36, 0.00], [0.36, 0.08],
    [0.28, 0.12], [0.20, 0.16], [0.20, 0.65],
    [0.27, 0.78], [0.22, 0.84], [0.20, 0.88],
    [0.30, 0.94], [0.34, 1.00], [0.20, 1.12],
    [0.00, 1.14]
  ];
}

const glassPieceMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.96,
  ior: 1.52,
  thickness: 0.35,
  roughness: 0.02,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.0,
  attenuationColor: new THREE.Color(0x6ed8cc),
  attenuationDistance: 0.6,
  envMapIntensity: 1.6,
  side: THREE.DoubleSide,
});

const tealTintMat = glassPieceMat.clone();
tealTintMat.attenuationColor = new THREE.Color(0x2d8f86);
tealTintMat.attenuationDistance = 0.4;

function makePiece(silhouette, mat, withCross = false) {
  const pts = silhouette.map(([r, y]) => new THREE.Vector2(r, y));
  const geo = new THREE.LatheGeometry(pts, 64);
  const mesh = new THREE.Mesh(geo, mat);

  if (withCross) {
    const group = new THREE.Group();
    group.add(mesh);
    const vertGeo = new THREE.BoxGeometry(0.05, 0.16, 0.05);
    const horzGeo = new THREE.BoxGeometry(0.13, 0.05, 0.05);
    const v = new THREE.Mesh(vertGeo, mat);
    v.position.y = 1.22;
    const h = new THREE.Mesh(horzGeo, mat);
    h.position.y = 1.24;
    group.add(v); group.add(h);
    return group;
  }
  return mesh;
}

function placePiece(parent, mesh, file, rank, scale = 1.0) {
  mesh.position.set(
    (file - 3.5) * SQUARE,
    0.005,
    (rank - 3.5) * SQUARE
  );
  mesh.scale.set(scale, scale, scale);
  parent.add(mesh);
}

const piecesGroup = new THREE.Group();
const S = 1.3;

// Light pieces (clearer crystal)
placePiece(piecesGroup, makePiece(silhouetteKing(), glassPieceMat, true), 4, 0, S);
placePiece(piecesGroup, makePiece(silhouetteQueen(), glassPieceMat), 3, 1, S);
placePiece(piecesGroup, makePiece(silhouetteBishop(), glassPieceMat), 5, 2, S);
placePiece(piecesGroup, makePiece(silhouettePawn(), glassPieceMat), 4, 3, S);
placePiece(piecesGroup, makePiece(silhouetteRook(), glassPieceMat), 0, 0, S);

// Dark pieces (teal-tinted crystal)
placePiece(piecesGroup, makePiece(silhouetteKing(), tealTintMat, true), 4, 7, S);
placePiece(piecesGroup, makePiece(silhouetteQueen(), tealTintMat), 3, 7, S);
placePiece(piecesGroup, makePiece(silhouettePawn(), tealTintMat), 4, 4, S);
placePiece(piecesGroup, makePiece(silhouetteBishop(), tealTintMat), 2, 6, S);
placePiece(piecesGroup, makePiece(silhouetteRook(), tealTintMat), 7, 7, S);

scene.add(piecesGroup);

// ── INTERACTION ──
let yaw = Math.PI / 6;
let pitch = Math.PI / 3.2;
const radius = 9;
let isDragging = false;
let lastX = 0, lastY = 0;
let autoRotate = true;
let autoRotateResumeTimeout = null;

function updateCamera() {
  const x = radius * Math.sin(pitch) * Math.sin(yaw);
  const y = radius * Math.cos(pitch);
  const z = radius * Math.sin(pitch) * Math.cos(yaw);
  camera.position.set(x, y, z);
  camera.lookAt(0, 0.5, 0);
}
updateCamera();

function onDown(e) {
  isDragging = true;
  autoRotate = false;
  clearTimeout(autoRotateResumeTimeout);
  const p = e.touches ? e.touches[0] : e;
  lastX = p.clientX;
  lastY = p.clientY;
}
function onMove(e) {
  if (!isDragging) return;
  e.preventDefault();
  const p = e.touches ? e.touches[0] : e;
  yaw -= (p.clientX - lastX) * 0.006;
  pitch -= (p.clientY - lastY) * 0.004;
  pitch = Math.max(0.35, Math.min(Math.PI / 2 - 0.1, pitch));
  lastX = p.clientX;
  lastY = p.clientY;
  updateCamera();
}
function onUp() {
  if (!isDragging) return;
  isDragging = false;
  autoRotateResumeTimeout = setTimeout(() => { autoRotate = true; }, 3000);
}

canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: true });
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);

function onResize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

function tick() {
  if (autoRotate) {
    yaw += 0.0018;
    updateCamera();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>

</body>
</html>
